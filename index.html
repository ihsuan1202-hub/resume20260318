<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>我的履歷</title>

<style>
body {
    margin: 0;
    font-family: "Noto Sans TC", sans-serif;
    background: #f5f6f8;
}

/* 頭部 */
.header {
    background: linear-gradient(120deg, #6c8cff, #88d3ce);
    color: white;
    padding: 40px 60px;
}

.header h1 {
    margin: 0;
}

.tag {
    opacity: 0.9;
}

/* 主體 */
.frame {
    display: flex;
    max-width: 1000px;
    margin: -40px auto 40px;
    gap: 20px;
}

/* 左側 */
.left {
    width: 30%;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* 右側 */
.right {
    width: 70%;
}

.right section {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* 按鈕 */
button {
    margin-top: 10px;
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    background: #6c8cff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #5a73d8;
}
</style>

</head>

<body>

<div class="header">
    <h1>王逸璇</h1>
    <p class="tag">前端學習者 / UI設計</p>
</div>

<div class="frame">

    <!-- 左邊 -->
    <div class="left">
         <img src="images/image_0.jpg" class="avatar">
        <h2>聯絡方式</h2>
        <p>Email：ihsuan1202@gmail.com</p>
        <p>電話：0912345678</p>

        <h2>技能</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </div>

    <!-- 右邊 -->
    <div class="right">
        <section>
            <h2>自我介紹</h2>
            <p id="intro">我是一位正在學習前端的學生。</p>
            <button onclick="changeText()">查看更多</button>
        </section>

        <section>
            <h2>學歷</h2>
            <p>亞洲大學 - 資訊傳播系</p>
        </section>

        <section>
            <h2>經歷</h2>
            <p>目前正在學習網頁設計</p>
        </section>
    </div>

</div>

<script>
function changeText() {
    document.getElementById("intro").innerHTML =
    "我正在學習 HTML、CSS、JavaScript，目標成為前端工程師。";
}
</script>

</body>
</html>
